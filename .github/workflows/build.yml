name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run build
      - run: bun test tests/*.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: portfolio
          path: dist/
      - run: bun run package
      - run: gh release create "$RELEASE_TAG" .artifacts/portfolio.zip --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Static portfolio build from master at $GITHUB_SHA" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: master-${{ github.run_id }}-${{ github.run_attempt }}
