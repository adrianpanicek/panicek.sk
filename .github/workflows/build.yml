name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      blog_only: ${{ steps.changes.outputs.blog_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Detect blog-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "blog_only=$(bun scripts/blog-only-change.ts "$BASE_SHA")" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: portfolio
          path: dist/
          if-no-files-found: error

  test:
    name: Unit and browser tests
    needs: build
    if: needs.build.outputs.blog_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: portfolio
          path: dist/
      - name: Unit and build-output tests
        run: bun run test
      - name: Install Chromium and Firefox
        run: bun x playwright install --with-deps chromium firefox
      - name: Terminal, Vim, and download browser tests
        shell: bash
        run: |
          mkdir -p .artifacts
          bun run test:browser:ci 2>&1 | tee .artifacts/browser-tests.log
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' ||
       (needs.build.outputs.blog_only == 'true' && needs.test.result == 'skipped'))
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: portfolio
          path: dist/
      - run: bun run package
      - name: Publish current master build
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "A newer master commit exists; skipping this superseded release."
            exit 0
          fi
          gh release create "$RELEASE_TAG" .artifacts/portfolio.zip --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Static portfolio build from master at $GITHUB_SHA" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: master-${{ github.run_id }}-${{ github.run_attempt }}
