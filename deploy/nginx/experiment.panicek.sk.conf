limit_req_zone $binary_remote_addr zone=portfolio_visits:1m rate=30r/m;

map $http_accept_encoding $experiment_brotli_suffix {
    default "";
    "~*(^|,)\s*br\s*(,|$)" ".br";
}

map $experiment_brotli_suffix $experiment_content_encoding {
    default "";
    ".br" "br";
}

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    http3 on;
    server_name experiment.panicek.sk;

    ssl_certificate /etc/letsencrypt/live/panicek.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panicek.sk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/http/panicek-experiment/current;
    index index.html;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location ~* \.(md|txt)$ {
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location ~ ^/(assets/.*|service-worker)\.js$ {
        types { }
        default_type text/javascript;
        add_header Content-Encoding $experiment_content_encoding;
        add_header Vary Accept-Encoding always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri$experiment_brotli_suffix @experiment_uncompressed;
    }

    location ~ ^/assets/.*\.wasm$ {
        types { }
        default_type application/wasm;
        add_header Content-Encoding $experiment_content_encoding;
        add_header Vary Accept-Encoding always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri$experiment_brotli_suffix @experiment_wasm_uncompressed;
    }

    location @experiment_wasm_uncompressed {
        types { }
        default_type application/wasm;
        add_header Vary Accept-Encoding always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location @experiment_uncompressed {
        try_files $uri =404;
    }

    location = /api/visit {
        limit_req zone=portfolio_visits burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:4381;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
