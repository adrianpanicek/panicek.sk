location = /api/visit {
    limit_req zone=portfolio_public_visits burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:4381;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    access_log off;
}

location ~ ^/(assets/.*|service-worker)\.js$ {
    types { }
    default_type text/javascript;
    add_header Content-Encoding $portfolio_content_encoding;
    add_header Vary Accept-Encoding always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files $uri$portfolio_brotli_suffix @portfolio_uncompressed;
}

location ~ ^/assets/.*\.wasm$ {
    types { }
    default_type application/wasm;
    add_header Content-Encoding $portfolio_content_encoding;
    add_header Vary Accept-Encoding always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files $uri$portfolio_brotli_suffix @portfolio_wasm_uncompressed;
}

location @portfolio_wasm_uncompressed {
    types { }
    default_type application/wasm;
    add_header Vary Accept-Encoding always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location @portfolio_uncompressed {
    try_files $uri =404;
}
